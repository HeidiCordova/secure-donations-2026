AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AQP-SOLIDARIA - Plataforma de Donaciones Seguras (Zero Trust, stage academic)

Parameters:
  Stage:
    Type: String
    Default: academic
    AllowedValues: [academic, prod]
    Description: Stage de despliegue. La ruta de simulación solo existe en academic (CA-06.1).
  LocalOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origen de la SPA en desarrollo local (CORS y callback de Cognito).
  WebOrigin:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[a-z0-9.-]+$'
    Description: >-
      Origen HTTPS de la SPA en CloudFront (sale en el output WebUrl). Se completa después del
      primer despliegue para evitar una dependencia circular entre CloudFront, Cognito y el API.

Conditions:
  IsAcademic: !Equals [!Ref Stage, academic]
  HasWebOrigin: !Not [!Equals [!Ref WebOrigin, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        STAGE: !Ref Stage
        NODE_OPTIONS: --enable-source-maps
        # Nombres de tablas por variable de entorno; el acceso lo da el rol IAM de cada función
        TABLE_PROJECTS: !Ref ProjectsTable
        TABLE_DONATIONS: !Ref DonationsTable
        TABLE_IDEMPOTENCY: !Ref IdempotencyTable
        TABLE_AUDIT: !Ref AuditEventsTable

Resources:
  # ---------------------------------------------------------------------------
  # Identidad (Policy Administrator): Cognito User Pool
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub aqp-solidaria-${Stage}
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Solo usuarios de prueba creados por el equipo (CA-NF10.1)
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # MFA TOTP opcional a nivel de pool (Cognito no lo configura por grupo).
      # Obligatorio para GESTOR y AUDITOR mediante control compensatorio:
      # TOTP preferido por usuario + scripts/check-mfa.sh (CA-11.1, T14). Nunca SMS.
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        project: aqp-solidaria
        stage: !Ref Stage

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub aqp-solidaria-${Stage}-${AWS::AccountId}

  DonanteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE
      Description: Crea intenciones de donación simuladas y ve su historial

  GestorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR
      Description: Crea y publica proyectos (MFA obligatorio)

  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR
      Description: Consulta eventos de auditoría (MFA obligatorio)

  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: aqp-solidaria-api
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Crear y publicar proyectos
        - ScopeName: donations.write
          ScopeDescription: Crear y simular donaciones
        - ScopeName: donations.read
          ScopeDescription: Ver historial propio
        - ScopeName: audit.read
          ScopeDescription: Consultar auditoría

  # App client público (SPA): sin secreto, Authorization Code + PKCE (CA-03.1)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub aqp-solidaria-spa-${Stage}
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - api/projects.write
        - api/donations.write
        - api/donations.read
        - api/audit.read
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub ${LocalOrigin}/callback
        - !If [HasWebOrigin, !Sub '${WebOrigin}/callback', !Ref AWS::NoValue]
      LogoutURLs:
        - !Sub ${LocalOrigin}/
        - !If [HasWebOrigin, !Sub '${WebOrigin}/', !Ref AWS::NoValue]
      # Solo refresh: el login es exclusivamente por hosted UI con PKCE (mínimo privilegio)
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      # Tokens de vida corta (CA-03.3, AD-07)
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 8
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # ---------------------------------------------------------------------------
  # Persistencia: DynamoDB on-demand (design.md §5)
  # Cifrado en reposo por defecto con clave propiedad de AWS (sin costo extra).
  # ---------------------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aqp-solidaria-${Stage}-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: aqp-solidaria
        - Key: stage
          Value: !Ref Stage

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aqp-solidaria-${Stage}-donations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: aqp-solidaria
        - Key: stage
          Value: !Ref Stage

  # pk = donorSub#createDonation#idempotencyKey; expira a las 24 h (CA-05.4)
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aqp-solidaria-${Stage}-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: project
          Value: aqp-solidaria
        - Key: stage
          Value: !Ref Stage

  # PK eventType, SK sk = timestamp#eventId: filtros por tipo y fecha (HU-10)
  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aqp-solidaria-${Stage}-audit-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: project
          Value: aqp-solidaria
        - Key: stage
          Value: !Ref Stage

  # ---------------------------------------------------------------------------
  # Policy Enforcement Point: API Gateway HTTP API con JWT authorizer
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins:
          - !Ref LocalOrigin
          - !If [HasWebOrigin, !Ref WebOrigin, !Ref AWS::NoValue]
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              # Los access tokens de Cognito no traen aud: se valida client_id (CA-NF02.1)
              audience:
                - !Ref UserPoolClient
      Tags:
        project: aqp-solidaria
        stage: !Ref Stage

  # ---------------------------------------------------------------------------
  # Funciones (un rol IAM por función; estas dos no acceden a DynamoDB)
  # ---------------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../backend
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  WhoAmIFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../backend
      Handler: whoami.handler
      Events:
        WhoAmI:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/whoami
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/donations.read

  WhoAmILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WhoAmIFunction}
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Frontend: S3 privado + CloudFront con OAC y cabeceras de seguridad (RNF-HU-01, RNF-HU-11)
  # ---------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Privado: solo CloudFront lee mediante OAC
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: aqp-solidaria
        - Key: stage
          Value: !Ref Stage

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub aqp-solidaria-${Stage}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub aqp-solidaria-${Stage}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # connect-src: solo el API y Cognito (login y JWKS)
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;
              font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';
              form-action 'self' https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com;
              connect-src 'self' https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
              https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
              https://cognito-idp.${AWS::Region}.amazonaws.com
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub aqp-solidaria-${Stage}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Política administrada CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # SPA: las rutas del router devuelven index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: project
          Value: aqp-solidaria
        - Key: stage
          Value: !Ref Stage

  # Solo esta distribución de CloudFront puede leer el bucket
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  Region:
    Value: !Ref AWS::Region
  ApiUrl:
    Description: URL base del API (HTTPS)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Dominio del login (hosted UI)
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  IsAcademicStage:
    Value: !If [IsAcademic, 'true', 'false']
  ProjectsTableName:
    Value: !Ref ProjectsTable
  DonationsTableName:
    Value: !Ref DonationsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  AuditEventsTableName:
    Value: !Ref AuditEventsTable
  WebUrl:
    Description: URL HTTPS de la SPA (usar como WebOrigin en samconfig.toml)
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
